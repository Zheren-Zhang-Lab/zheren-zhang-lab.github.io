<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1254" height="1254" viewBox="0 0 1254 1254"
     role="img" aria-labelledby="title desc">
  <title id="title">Synthetic biology design and outcomes</title>
  <desc id="desc">Scientific line illustration showing DNA design, an engineered bacterium, biotechnology products, and pollutant degradation.</desc>

  <defs>
    <filter id="warm_glow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feFlood flood-color="#eacd76" flood-opacity="0.18" result="colour"/>
      <feComposite in="colour" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line { fill: none; stroke: #eacd76; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #eacd76; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .bold { fill: none; stroke: #eacd76; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 9 9; }
      .dot { fill: #0a0e14; stroke: #eacd76; stroke-width: 3.2; }
      .solid { fill: #eacd76; stroke: none; }

      @media (prefers-reduced-motion: no-preference) {
        #dna { animation: gentle-emphasis 7s ease-in-out infinite; }
        #design_icon { animation: gentle-emphasis 7s ease-in-out 0.8s infinite; }
        #design_icon > g {
          transform-box: view-box;
          transform-origin: 279px 699px;
          animation: pencil-edit 5.2s ease-in-out infinite;
        }
        #arrow_1 { animation: arrow-emphasis 3.8s ease-in-out 0.5s infinite; }
        #bacterium { animation: centre-emphasis 7s ease-in-out 1.3s infinite; }
        #plasmid_top { animation: module-emphasis 5.5s ease-in-out 0.4s infinite; }
        #plasmid_bottom { animation: module-emphasis 5.5s ease-in-out 1.6s infinite; }
        #gear {
          transform-origin: 0 0;
          animation: gear-turn 30s linear infinite, module-emphasis 5.5s ease-in-out 1s infinite;
        }
        #arrow_2 { animation: arrow-emphasis 3.8s ease-in-out 1.6s infinite; }
        #outcome_circle { animation: quiet-emphasis 8s ease-in-out 2s infinite; }
        #biotech_bacterium { animation: producer-emphasis 11s ease-in-out infinite; }
        #molecule,
        #flask,
        #product_bottle,
        #product_drop,
        #pollutant_drop_1,
        #pollutant_drop_2,
        #pollutant_drop_3 {
          transform-box: fill-box;
          transform-origin: center;
        }
        #molecule { animation: product-reveal 11s ease-in-out 0.6s infinite both; }
        #flask { animation: product-reveal 11s ease-in-out 1.8s infinite both; }
        #product_bottle { animation: product-reveal 11s ease-in-out 2.4s infinite both; }
        #product_drop { animation: product-reveal 11s ease-in-out 3s infinite both; }
        #cleanup_bacterium { animation: cleanup-emphasis 11s ease-in-out 1.2s infinite both; }
        #pollutant_drop_1 { animation: pollutant-diminish 11s ease-in-out 2.6s infinite both; }
        #pollutant_drop_2 { animation: pollutant-diminish 11s ease-in-out 3.2s infinite both; }
        #pollutant_drop_3 { animation: pollutant-diminish 11s ease-in-out 3.8s infinite both; }
        #earth { animation: remediation-reveal 11s ease-in-out 4.2s infinite both; }
        #leaf { animation: remediation-reveal 11s ease-in-out 4.7s infinite both; }
        .dash { animation: dash-drift 22s linear infinite; }
      }

      @keyframes gentle-emphasis {
        0%, 100% { opacity: 0.9; }
        45%, 60% { opacity: 1; }
      }
      @keyframes pencil-edit {
        0%, 100% { transform: rotate(38deg) translate(0, 0); }
        45% { transform: rotate(36.8deg) translate(-1px, 0.8px); }
        70% { transform: rotate(37.5deg) translate(-0.4px, 0.3px); }
      }
      @keyframes centre-emphasis {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }
      @keyframes module-emphasis {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }
      @keyframes arrow-emphasis {
        0%, 100% { opacity: 0.58; }
        50% { opacity: 1; }
      }
      @keyframes quiet-emphasis {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      @keyframes producer-emphasis {
        0%, 100% { opacity: 0.88; }
        8%, 18% { opacity: 1; }
        30%, 88% { opacity: 0.92; }
      }
      @keyframes product-reveal {
        0%, 8%, 100% { opacity: 0.56; transform: scale(0.985); }
        22%, 68% { opacity: 1; transform: scale(1); }
        86% { opacity: 0.72; transform: scale(0.994); }
      }
      @keyframes cleanup-emphasis {
        0%, 100% { opacity: 0.86; }
        10%, 24% { opacity: 1; }
        36%, 88% { opacity: 0.91; }
      }
      @keyframes pollutant-diminish {
        0%, 12%, 100% { opacity: 1; transform: scale(1); }
        38%, 68% { opacity: 0.24; transform: scale(0.92); }
        84% { opacity: 0.7; transform: scale(0.975); }
      }
      @keyframes remediation-reveal {
        0%, 10%, 100% { opacity: 0.58; }
        30%, 70% { opacity: 1; }
        88% { opacity: 0.76; }
      }
      @keyframes dash-drift {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -36; }
      }
      @keyframes gear-turn {
        from { transform: translate(530px, 579px) rotate(0deg); }
        to { transform: translate(530px, 579px) rotate(360deg); }
      }
    </style>
  </defs>

